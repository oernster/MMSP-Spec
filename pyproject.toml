# MMSP is a specification, not a package. This repository publishes the spec
# text, the JSON Schemas and a conformance suite that checks them; there is
# nothing here to build, install or distribute, so no [build-system] and no
# [project] metadata are declared. Meridian is the reference implementation.
#
# Dependencies live in requirements.txt. This file configures the test run only.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tests/validators --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["tests/validators"]
branch = true

[tool.coverage.report]
show_missing = true
