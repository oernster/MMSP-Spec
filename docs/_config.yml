title: MMSP
description: MultiMedia Subscription Protocol, a JSON-based pull-only protocol for subscribing to and consuming multimedia content feeds. Open community specification, semantic superset of RSS and Atom.
url: https://ernster.dev
baseurl: /MMSP-Spec
lang: en
theme: minima

# Fail the build on malformed front matter instead of silently dropping it.
# An unquoted title containing a colon is invalid YAML: Jekyll's default is to
# warn and discard every key on the page, which silently loses permalink and
# description and moves the page to an unintended URL.
strict_front_matter: true

plugins:
  - jekyll-seo-tag

# The social preview image for every page. jekyll-seo-tag reads the image from
# the PAGE only, so it is given to every page here as a front matter default;
# a site-level image key is ignored. The icon is square, so the Twitter card is
# the small one rather than the cropped large. It also sits on the page: a
# site-level twitter key would emit a twitter:site tag with an empty handle.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/MMSP-icon.png
        width: 1024
        height: 1024
        alt: MMSP icon
      twitter:
        card: summary

header_pages:
  - spec.md

social:
  name: MMSP Community
  links:
    - https://github.com/oernster/MMSP-Spec

minima:
  skin: classic
