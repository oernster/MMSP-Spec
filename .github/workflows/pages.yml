name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The conformance suite gates the deploy. Publishing the specification while
  # the suite proving it is internally consistent runs only when someone
  # remembers to is the wrong way round for a standards document.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the conformance suite
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - uses: actions/checkout@v4

      # The page title carries the draft identifier. That identifier lives in
      # the name of the draft file. Deriving it here rather than repeating
      # it means advancing to the next draft is a rename, not a rename plus an
      # edit to this file: a hardcoded title would keep publishing the old
      # draft number silently, with a green build, until someone noticed.
      - name: Inject spec into docs
        run: |
          matches=$(ls -1 spec/draft-mmsp-*.md | wc -l)
          if [ "$matches" -ne 1 ]; then
            echo "Expected exactly one spec/draft-mmsp-*.md, found $matches." >&2
            exit 1
          fi
          spec_path=$(ls -1 spec/draft-mmsp-*.md)
          draft=$(basename "$spec_path" .md)
          printf -- '---\nlayout: default\ntitle: "MMSP Specification: %s"\ndescription: "Full text of the MultiMedia Subscription Protocol specification. Defines feed manifest schema, item types, source types, poll semantics, discovery, normalization and filter grammar."\npermalink: /spec/\n---\n\n' "$draft" \
            | cat - "$spec_path" > docs/spec.md

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
